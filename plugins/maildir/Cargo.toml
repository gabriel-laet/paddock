# `paddock-maildir`: a Maildir (or a folder of .eml files) as a source.
# Depends on paddock-protocol (through paddock-mail) and nothing else of
# paddock's.

[package]
name = "paddock-maildir"
description = "A Maildir as a paddock source"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
paddock-protocol = { path = "../../crates/protocol" }
paddock-mail = { path = "../mail" }
anyhow.workspace = true

[dev-dependencies]
tempfile = "3.15"

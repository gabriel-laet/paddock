[package]
name = "paddock"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "An inbox kernel with a CLI"
repository = "https://github.com/gabriel-laet/paddock"
homepage = "https://github.com/gabriel-laet/paddock"

[dependencies]
anyhow = "1.0.95"
cel-interpreter = "0.10.0"
chrono = { version = "0.4.39", default-features = false, features = ["clock", "std"] }
clap = { version = "=4.5.28", features = ["derive"] }
dirs = "5.0"
regex = "1.11"
reqwest = { version = "=0.12.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
rss = "=2.0.12"
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "=1.0.151"
toml = "0.8.19"

[dev-dependencies]
tempfile = "3.15"

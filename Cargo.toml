[workspace]
resolver = "2"
members = ["crates/kernel", "crates/protocol", "crates/paddock", "crates/app", "plugins/rss", "plugins/mail", "plugins/maildir", "plugins/imap", "plugins/wacli", "plugins/gog", "plugins/hey"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/gabriel-laet/paddock"

[workspace.dependencies]
anyhow = "1.0.95"
chrono = { version = "0.4.39", default-features = false, features = ["clock", "std"] }
regex = "1.11"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "=1.0.151"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
